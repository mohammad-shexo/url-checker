apiVersion: v1
kind: Pod
metadata:
  name: busybox-test
  namespace: url-checker
  labels:
    app: busybox-test
spec:
  restartPolicy: Never   # eenmalig testpod, niet herstarten
  containers:
    - name: busybox
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "=== URL Checker connectiviteitstest ==="
          echo ""
          echo "Test 1: Health check"
          wget -qO- http://url-checker/health
          echo ""
          echo "Test 2: POST /check met geldige URLs"
          wget -qO- \
            --post-data='{"urls":["https://google.com","https://github.com"]}' \
            --header='Content-Type: application/json' \
            http://url-checker/check
          echo ""
          echo "Test 3: POST /check met ongeldige URL"
          wget -qO- \
            --post-data='{"urls":["https://deze-site-bestaat-niet-xyz.invalid"]}' \
            --header='Content-Type: application/json' \
            http://url-checker/check
          echo ""
          echo "=== Test voltooid ==="
